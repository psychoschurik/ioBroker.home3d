name: Test and Release

on:
    push:
        branches:
            - '*'
        tags:
            # normal versions
            - 'v[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Type check, lint, unit tests and package files
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        runs-on: ubuntu-latest
        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: 24.x
                  type-checking: true
                  lint: true
                  # the tests check the generated bundles (gitignored, nogit), so build them first
                  test-command: 'npm run build && npm test'

    # Build of the browser bundles on all platforms. There is no instance to start (onlyWWW).
    adapter-tests:
        needs: [check-and-lint]
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}
                  build: true

    deploy:
        needs: [check-and-lint, adapter-tests]
        permissions:
            contents: write
            id-token: write
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '24.x'
                  build: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
