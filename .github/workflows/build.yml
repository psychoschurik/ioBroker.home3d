name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:all
      - run: npm test
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: iobroker-3d-home-node-${{ matrix.node }}
          path: iobroker.3d-home-*.tgz
